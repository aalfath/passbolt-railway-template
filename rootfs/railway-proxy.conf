# Railway's edge terminates TLS and talks plain HTTP to the container.
# Take the client address from X-Real-IP, which the edge sets.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Real-IP;

# PHP decides the request scheme from $_SERVER['HTTPS']. Public traffic comes
# through the edge over HTTPS; only an explicit "http" from the edge counts as
# plain. Requests without the header (Railway's health check, the private
# network) are treated as HTTPS, so PASSBOLT_SSL_FORCE doesn't redirect them.
map $http_x_forwarded_proto $railway_https {
    http    "";
    default on;
}
